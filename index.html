<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Side Hustle Toolkit</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:#fff;
    line-height:1.6;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

.hero{
    text-align:center;
    padding:100px 20px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.hero h1{
    font-size:60px;
    margin-bottom:20px;
}

.hero p{
    font-size:22px;
    max-width:700px;
    margin:auto;
}

.cta-btn{
    display:inline-block;
    margin-top:30px;
    padding:18px 40px;
    background:#fff;
    color:#111;
    text-decoration:none;
    border-radius:50px;
    font-weight:bold;
}

.section{
    padding:80px 0;
}

.section-title{
    text-align:center;
    margin-bottom:50px;
    font-size:40px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:#1e293b;
    padding:30px;
    border-radius:15px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    margin-bottom:15px;
}

.card a{
    color:#60a5fa;
    text-decoration:none;
}

.stats{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
}

.stat{
    text-align:center;
}
