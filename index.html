<title>AI Side Hustle Toolkit</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#0f172a;
color:white;
line-height:1.6;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
}

.hero{
padding:100px 20px;
text-align:center;
background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.hero h1{
font-size:60px;
margin-bottom:20px;
}

.hero p{
font-size:22px;
max-width:700px;
margin:auto;
}

.btn{
display:inline-block;
margin-top:30px;
padding:15px 35px;
background:white;
color:#111827;
text-decoration:none;
font-weight:bold;
border-radius:50px;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

.section{
padding:80px 0;
}

.section-title{
text-align:center;
font-size:40px;
margin-bottom:50px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:15px;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.card h3{
margin-bottom:15px;
color:#60a5fa;
}

.stats{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:40px;
}

.stat{
text-align:center;
}

.stat h2{
font-size:48px;
color:#60a5fa;
}

.lead{
background:#111827;
padding:80px 20px;
text-align:center;
}

input{
padding:15px;
width:350px;
max-width:90%;
border:none;
border-radius:8px;
margin-top:15px;
}

button{
padding:15px 25px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#1d4ed8;
}

footer{
padding:40px;
text-align:center;
background:#020617;
margin-top:50px;
}

.small{
opacity:.7;
font-size:14px;
}

@media(max-width:768px){

.hero h1{
font-size:40px;
}

.hero p{
font-size:18px;
}

.section-title{
font-size:30px;
}

}

</style>
</head>
