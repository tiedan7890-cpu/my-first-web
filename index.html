<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenSpace - 脑洞发呆与解压小空间</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LMLTZFDC1C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LMLTZFDC1C');
    </script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 10px;
        }
        header h1 { font-size: 1.8rem; margin-bottom: 5px; color: #818cf8; }
        header p { color: var(--text-sub); font-size: 0.95rem; }
        
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            text-align: center;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: var(--border);
            border: none;
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: var(--accent);
            color: white;
        }
        
        .mode-box { display: none; width: 100%; height: 100%; }
        .mode-box.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* 气泡模式 */
        #bubble-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-height: 250px;
            overflow-y: auto;
            padding: 10px;
        }
        .bubble {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #818cf8, #4f46e5);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset -4px -4px 10px rgba(0,0,0,0.4), 0 4px 10px rgba(99,102,241,0.3);
            transition: transform 0.1s;
        }
        .bubble:active { transform: scale(0.85); }
        .bubble.popped { transform: scale(0); opacity: 0; pointer-events: none; }

        /* 木鱼模式 */
        .muyu-btn {
            background: radial-gradient(circle at 35% 35%, #d97706, #b45309);
            color: #fef3c7;
            border: none;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(180, 83, 9, 0.4);
            transition: transform 0.08s;
            margin-bottom: 15px;
        }
        .muyu-btn:active { transform: scale(0.92); }
        .merit-text { font-size: 1.1rem; color: #fbbf24; }

        /* 追光模式画布 */
        #ripple-canvas {
            width: 100%;
            height: 260px;
            background: #090d16;
            border-radius: 12px;
            cursor: pointer;
        }

        .action-bar {
            margin-top: 15px;
        }
        .reset-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .reset-btn:hover { border-color: var(--accent); color: var(--text-main); }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-sub);
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .support-link {
            color: #818cf8;
            text-decoration: none;
            border: 1px dashed #818cf8;
            padding: 4px 10px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .support-link:hover { background: rgba(129, 140, 248, 0.1); }
    </style>
</head>
<body>

    <header>
        <h1>ZenSpace 呆空</h1>
        <p>脑子累了？在这里毫无压力地发一会儿呆吧。</p>
    </header>

    <div class="container">
        <!-- 导航切换 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('bubbles')">🫧 捏气泡</button>
            <button class="tab-btn" onclick="switchTab('muyu')">🐟 电子木鱼</button>
            <button class="tab-btn" onclick="switchTab('ripple')">✨ 追光涟漪</button>
        </div>

        <!-- 模式 1：捏气泡 -->
        <div id="mode-bubbles" class="mode-box active">
            <div id="bubble-container"></div>
            <div class="action-bar">
                <button class="reset-btn" onclick="initBubbles()">刷新一地气泡</button>
            </div>
        </div>

        <!-- 模式 2：电子木鱼 -->
        <div id="mode-muyu" class="mode-box">
            <button class="muyu-btn" onclick="hitMuyu()">敲木鱼</button>
            <div class="merit-text">功德 +1 (烦恼 -1) : <span id="merit-count">0</span></div>
        </div>

        <!-- 模式 3：追光涟漪 -->
        <div id="mode-ripple" class="mode-box">
            <canvas id="ripple-canvas"></canvas>
            <p style="font-size: 0.8rem; color: var(--text-sub); margin-top: 8px;">在框内滑动鼠标或手指，留下平静微光</p>
        </div>
    </div>

    <footer>
        <span>Designed for Deep Relax</span>
        <a href="https://tiedan7890.gumroad.com" target="_blank" class="support-link">☕ 请作者喝咖啡</a>
    </footer>

    <script>
        // 标签页切换
        function switchTab(mode) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.mode-box').forEach(box => box.classList.remove('active'));
            
            if(mode === 'bubbles') {
                document.querySelector('[onclick="switchTab(\'bubbles\')"]').classList.add('active');
                document.getElementById('mode-bubbles').classList.add('active');
            } else if(mode === 'muyu') {
                document.querySelector('[onclick="switchTab(\'muyu\')"]').classList.add('active');
                document.getElementById('mode-muyu').classList.add('active');
            } else if(mode === 'ripple') {
                document.querySelector('[onclick="switchTab(\'ripple\')"]').classList.add('active');
                document.getElementById('mode-ripple').classList.add('active');
                resizeCanvas();
            }
        }

        // 气泡逻辑
        function initBubbles() {
            const container = document.getElementById('bubble-container');
            container.innerHTML = '';
            for(let i = 0; i < 20; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.onclick = () => {
                    bubble.classList.add('popped');
                    playPopSound();
                };
                container.appendChild(bubble);
            }
        }
        function playPopSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }
        initBubbles();

        // 木鱼逻辑
        let merit = 0;
        function hitMuyu() {
            merit++;
            document.getElementById('merit-count').innerText = merit;
            playMuyuSound();
        }
        function playMuyuSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch(e) {}
        }

        // 画布追光涟漪逻辑
        const canvas = document.getElementById('ripple-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = 240;
        }
        window.onresize = resizeCanvas;

        canvas.onmousemove = (e) => {
            const rect = canvas.getBoundingClientRect();
            particles.push({
                x: e.clientX - rect.left,
                y: e.clientY - rect.top,
                radius: 2,
                maxRadius: 30 + Math.random() * 20,
                alpha: 1
            });
        };
        canvas.ontouchmove = (e) => {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            particles.push({
                x: touch.clientX - rect.left,
                y: touch.clientY - rect.top,
                radius: 2,
                maxRadius: 30 + Math.random() * 20,
                alpha: 1
            });
        };

        function animateRipple() {
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                p.radius += 1;
                p.alpha -= 0.03;
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                    return;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(129, 140, 248, ${p.alpha})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });
            requestAnimationFrame(animateRipple);
        }
        animateRipple();
    </script>
</body>
</html>
